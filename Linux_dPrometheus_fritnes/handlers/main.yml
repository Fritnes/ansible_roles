- name: Restart container {{ prometheus_container_name }}
  ansible.builtin.command: docker compose down
  args:
    chdir: "{{ docker_folder }}/{{ prometheus_container_name }}/"
  changed_when: true
  notify: Start container {{ prometheus_container_name }}

- name: Start container {{ prometheus_container_name }}
  ansible.builtin.command: docker compose up -d --quiet-pull --force-recreate
  args:
    chdir: "{{ docker_folder }}/{{ prometheus_container_name }}/"
  changed_when: true

- name: Validate Grafana credentials
  ansible.builtin.assert:
    that:
      - grafana_admin_password | length >= 16
      - prometheus_image is match('^.+(:v?[0-9][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$')
      - grafana_image is match('^.+(:v?[0-9][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$')
    fail_msg: Set a unique Grafana password and pinned Prometheus and Grafana image references.

- name: Create Prometheus directory
  ansible.builtin.file:
    path: "{{ docker_folder }}/{{ prometheus_container_name }}"
    state: directory
    mode: "0755"

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: "{{ prometheus_storage_tsdb_path }}"
    owner: nobody
    group: nogroup
    state: directory
    mode: "0755"

- name: Generate Prometheus compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ docker_folder }}/{{ prometheus_container_name }}/docker-compose.yml"
    mode: "0600"
  notify: Restart container {{ prometheus_container_name }}

- name: Configure Prometheus
  ansible.builtin.import_tasks: config.yml

---
- name: Ensure this role is running on Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: Linux_WORKSTATION_fritnes requires Ubuntu because its repositories are Ubuntu PPAs.

- name: Create APT keyring directory
  ansible.builtin.file:
    path: "{{ workstation_spotify_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: workstation_enable_spotify | bool or (workstation_ppa_repositories | length > 0)

- name: Create Launchpad APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: workstation_ppa_repositories | length > 0

- name: Look up Launchpad PPA signing keys
  ansible.builtin.uri:
    url: "https://api.launchpad.net/1.0/~{{ item.split(':')[1].split('/')[0] }}/+archive/ubuntu/{{ item.split('/')[-1] }}"
    return_content: false
    status_code: 200
  loop: "{{ workstation_ppa_repositories }}"
  register: workstation_ppa_metadata

- name: Download Spotify APT signing key
  ansible.builtin.get_url:
    url: "{{ workstation_spotify_key_url }}"
    dest: "{{ workstation_spotify_keyring }}"
    owner: root
    group: root
    mode: '0644'
  when: workstation_enable_spotify | bool

- name: Download Launchpad PPA signing keys
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ item.json.signing_key_fingerprint }}"
    dest: "/etc/apt/keyrings/ppa-{{ item.item.split(':')[1] | replace('/', '-') }}.asc"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ workstation_ppa_metadata.results | default([]) }}"

- name: Add workstation PPAs
  ansible.builtin.deb822_repository:
    name: "ppa-{{ item.item.split(':')[1] | replace('/', '-') }}"
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/{{ item.item.split(':')[1].split('/')[0] }}/{{ item.item.split('/')[-1] }}/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: "/etc/apt/keyrings/ppa-{{ item.item.split(':')[1] | replace('/', '-') }}.asc"
    state: present
    install_python_debian: true
  loop: "{{ workstation_ppa_metadata.results | default([]) }}"

- name: Add Spotify APT repository
  ansible.builtin.deb822_repository:
    name: spotify
    types: [deb]
    uris: "{{ workstation_spotify_uri }}"
    suites: "{{ workstation_spotify_suite }}"
    components: "{{ workstation_spotify_components }}"
    signed_by: "{{ workstation_spotify_keyring }}"
    state: present
    install_python_debian: true
  when: workstation_enable_spotify | bool

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Configure Firefox package pinning
  ansible.builtin.copy:
    src: mozilla-firefox
    dest: "{{ workstation_firefox_preferences_path }}"
    owner: root
    group: root
    mode: '0644'
  when: workstation_manage_firefox_preferences | bool

- name: Install workstation packages
  ansible.builtin.apt:
    name: "{{ workstation_packages }}"
    state: present

- name: Install Spotify
  ansible.builtin.apt:
    name: spotify-client
    state: present
  when: workstation_enable_spotify | bool

- name: Upgrade all APT packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: workstation_dist_upgrade | bool

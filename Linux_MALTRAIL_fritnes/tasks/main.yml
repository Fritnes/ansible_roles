---
# tasks file for AnsibleMALTRAIL
- name: Install useful packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - git
      - python3-pcapy
      - python3-setuptools
    state: present

- name: Clone a github repository  # noqa: latest[git]
  ansible.builtin.git:
    repo: "{{ maltrail_repo }}"
    dest: "{{ maltrail_path }}"
    clone: true
    update: true

- name: Autostart maltrail server
  ansible.builtin.cron:
    name: "Autostart maltrail server"
    minute: "*/5"
    job: "{{ cron_command_autostart_server }}"

- name: Periodic maltrail update
  ansible.builtin.cron:
    name: "Periodic maltrail update"
    minute: "0"
    hour: "1"
    job: "{{ cron_command_periodic_update }}"

- name: Autostart maltrail sensor
  ansible.builtin.cron:
    name: "Autostart maltrail sensor"
    minute: "*/1"
    job: "{{ cron_command_autostart_sensor }}"

- name: Periodic maltrail restart
  ansible.builtin.cron:
    name: "Periodic maltrail restart"
    minute: "2"
    hour: "1"
    job: "{{ cron_command_periodic_restart }}"

- name: Configure fail2ban integration
  ansible.builtin.cron:
    name: "fail2ban_integration"
    minute: "10"
    job: "{{ cron_command_fail2ban_integration }}"

- name: Copy systemd service file for {{ item }}
  ansible.builtin.template:
    src: "{{ item }}.service"
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: "0644"
  loop:
    - "maltrail-sensor"
    - "maltrail-server"

- name: Restart service {{ item }}
  ansible.builtin.systemd:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ item }}"
  loop:
    - "maltrail-sensor"
    - "maltrail-server"

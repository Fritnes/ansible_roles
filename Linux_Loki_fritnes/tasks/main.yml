- name: Create Loki directory
  ansible.builtin.file:
    path: "{{ docker_folder }}/{{ loki_container_name }}"
    state: directory
    mode: "0755"

- name: Create Loki data directory
  ansible.builtin.file:
    path: "{{ docker_folder }}/{{ loki_container_name }}/data"
    state: directory
    owner: 10001
    group: 10001
    mode: "0755"

- name: Generate Loki compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ docker_folder }}/{{ loki_container_name }}/docker-compose.yml"
    mode: "0600"
  notify: Restart container {{ loki_container_name }}

- name: Generate Loki service
  ansible.builtin.template:
    src: "docker_compose_service.j2"
    dest: "/etc/systemd/system/{{ loki_container_name }}.service"
    mode: "0644"
  notify: Restart container {{ loki_container_name }}

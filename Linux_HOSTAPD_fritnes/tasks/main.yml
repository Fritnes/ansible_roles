---
- name: Validate Hostapd configuration
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - hostapd_country_code is match('^[A-Z]{2}$')
      - hostapd_ssid is match('^[^\r\n]{1,32}$')
      - hostapd_wpa_passphrase is match('^[ -~]{8,63}$')
    fail_msg: Set a two-letter uppercase country code and an 8-63 character printable ASCII Wi-Fi passphrase.
  no_log: true

- name: Install Hostapd
  ansible.builtin.apt:
    name: hostapd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Hostapd configuration
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart Hostapd
  no_log: true

- name: Enable and start Hostapd
  ansible.builtin.systemd:
    name: hostapd
    enabled: true
    masked: false
    state: started
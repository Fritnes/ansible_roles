---
# tasks file for RPstore
- name: Install useful packages
  ansible.builtin.apt:
    name:
      - hd-idle
    state: present

- name: SSHD
  ansible.builtin.lineinfile:
    dest: /etc/default/hd-idle
    state: present
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^START_HD_IDLE=', line: 'START_HD_IDLE=true' }
    - { regexp: '^HD_IDLE_OPTS=', line: 'HD_IDLE_OPTS="-i 1200 -l /var/log/hd-idle.log"' }
  notify: Restart hd-idle

- name: Remove udisks2
  ansible.builtin.apt:
    name:
      - udisks2
    state: absent

- name: Stop and disable services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - "smartmontools.service"
    - "fstrim.timer"
    - "e2scrub_all.timer"

- name: Dependonsi Debian
  ansible.builtin.include_tasks: "smb.yml"

- name: Require a pinned Minecraft server image
  ansible.builtin.assert:
    that:
      - minecraft_server_image is match('^.+(:v?[0-9][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$')
    fail_msg: Set minecraft_server_image to an explicit version tag or digest.

- name: Create Minecraft server directory
  ansible.builtin.file:
    path: "{{ minecraft_server_folder }}/{{ minecraft_server_container_name }}"
    state: directory
    mode: "0755"

- name: Generate Minecraft server compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ minecraft_server_folder }}/{{ minecraft_server_container_name }}/docker-compose.yml"
    mode: "0644"

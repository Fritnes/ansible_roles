- name: Require a pinned Blackbox Exporter image
  ansible.builtin.assert:
    that:
      - blackbox_exporter_image is match('^.+(:v?[0-9][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$')
    fail_msg: Set blackbox_exporter_image to an explicit version tag or digest.

- name: Create Blackbox Exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ docker_folder }}/{{ blackbox_exporter_container_name }}"
    - "{{ docker_folder }}/{{ blackbox_exporter_container_name }}/conf"

- name: Copy config.yml
  ansible.builtin.copy:
    src: config.yml
    dest: "{{ docker_folder }}/{{ blackbox_exporter_container_name }}/conf/config.yml"
    mode: "0644"

- name: Generate Blackbox Exporter compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ docker_folder }}/{{ blackbox_exporter_container_name }}/docker-compose.yml"
    mode: "0600"
  notify: Restart container {{ blackbox_exporter_container_name }}

- name: Generate Blackbox Exporter service
  ansible.builtin.template:
    src: "docker_compose_service.j2"
    dest: "/etc/systemd/system/{{ blackbox_exporter_container_name }}.service"
    mode: "0644"
  notify: Restart container {{ blackbox_exporter_container_name }}

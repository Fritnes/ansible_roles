- name: Download KasmVNC binary to local folder
  become: false
  ansible.builtin.get_url:
    url: >-
      https://github.com/kasmtech/KasmVNC/releases/download/v{{ kasmvnc_latest_releases }}/
      kasmvncserver_{{ ansible_distribution_release }}_{{ kasmvnc_latest_releases }}_{{ kasmvnc_architecture }}.deb
    dest: >-
      /tmp/kasmvncserver_{{ ansible_distribution_release }}_{{ kasmvnc_latest_releases }}_{{ kasmvnc_architecture }}.deb
    mode: "0644"
  register: _download_binary
  until: _download_binary is succeeded
  retries: 5
  delay: 2
  delegate_to: localhost
  check_mode: false

- name: Propagate KasmVNC binaries
  ansible.builtin.copy:
    src: >-
      /tmp/kasmvncserver_{{ ansible_distribution_release }}_{{ kasmvnc_latest_releases }}_{{ kasmvnc_architecture }}.deb
    dest: >-
      /tmp/kasmvncserver_{{ ansible_distribution_release }}_{{ kasmvnc_latest_releases }}_{{ kasmvnc_architecture }}.deb
    mode: "0644"

- name: Install KasmVNC package
  ansible.builtin.apt:
    deb: >-
      /tmp/kasmvncserver_{{ ansible_distribution_release }}_{{ kasmvnc_latest_releases }}_{{ kasmvnc_architecture }}.deb
    state: present

- name: Install KDE Plasma packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - kde-plasma-desktop
      - plasma-workspace-wayland
    state: present

- name: Add KasmVNC user
  ansible.builtin.user:
    name: "{{ kasmvnc_system_username }}"
    state: present
    createhome: true

- name: Create KasmVNC directory
  ansible.builtin.file:
    path: "/home/{{ kasmvnc_system_username }}/.vnc"
    state: directory
    owner: "{{ kasmvnc_system_username }}"
    group: "{{ kasmvnc_system_username }}"
    mode: "0700"

- name: Copy xstartup file to target machine
  ansible.builtin.copy:
    src: xstartup
    dest: "/home/{{ kasmvnc_system_username }}/.vnc/xstartup"
    owner: "{{ kasmvnc_system_username }}"
    group: "{{ kasmvnc_system_username }}"
    mode: "0755"

- name: Add KasmVNC user to ssl-cert group
  ansible.builtin.user:
    name: "{{ kasmvnc_system_username }}"
    groups: ssl-cert
    append: true

- name: Set KasmVNC password
  become: true
  become_user: "{{ kasmvnc_system_username }}"
  ansible.builtin.command:
    argv:
      - vncpasswd
      - -u
      - "{{ kasm_username }}"
      - -w
      - -r
      - "/home/{{ kasmvnc_system_username }}/.kasmpasswd"
    stdin: "{{ kasm_password }}\n{{ kasm_password }}\n"
  changed_when: true
  no_log: true

- name: Copy the KasmVNC systemd service file
  ansible.builtin.template:
    src: kasmvnc.service.j2
    dest: "/etc/systemd/system/kasmvnc_{{ kasmvnc_system_username }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kasmvnc

- name: Create dockerTMP directory
  ansible.builtin.file:
    path: "{{ docker_folder }}/{{ docker_tmp_container_name }}"
    state: directory
    mode: "0755"

- name: Generate dockerTMP compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ docker_folder }}/{{ docker_tmp_container_name }}/docker-compose.yml"
    mode: "0600"
  notify: Restart container {{ docker_tmp_container_name }}

- name: Generate dockerTMP service
  ansible.builtin.template:
    src: "docker_compose_service.j2"
    dest: "/etc/systemd/system/{{ docker_tmp_container_name }}.service"
    mode: "0644"
  notify: Restart container {{ docker_tmp_container_name }}

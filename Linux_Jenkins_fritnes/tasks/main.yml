- name: Require Docker group ID when host socket access is enabled
  ansible.builtin.assert:
    that:
      - jenkins_docker_gid | string | length > 0
    fail_msg: Set jenkins_docker_gid to the host Docker socket group ID.
  when: jenkins_docker_socket_enabled | bool

- name: Require a pinned Jenkins image
  ansible.builtin.assert:
    that:
      - jenkins_image is match('^.+(:v?[0-9][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$')
    fail_msg: Set jenkins_image to an explicit version tag or digest.

- name: Create Jenkins directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ docker_folder }}/{{ jenkins_container_name }}"
    - "{{ docker_folder }}/{{ jenkins_container_name }}/jenkins_home"

- name: Generate Jenkins compose file
  ansible.builtin.template:
    src: "docker_compose.j2"
    dest: "{{ docker_folder }}/{{ jenkins_container_name }}/docker-compose.yml"
    mode: "0600"
  notify: Restart container {{ jenkins_container_name }}

- name: Generate Jenkins Dockerfile
  ansible.builtin.template:
    src: "Dockerfile.j2"
    dest: "{{ docker_folder }}/{{ jenkins_container_name }}/Dockerfile"
    mode: "0644"
  notify: Restart container {{ jenkins_container_name }}

- name: Pull Jenkins image
  ansible.builtin.command: docker-compose pull
  args:
    chdir: "{{ docker_folder }}/{{ jenkins_container_name }}"
  register: jenkins_pull
  changed_when: "'Downloaded newer image' in jenkins_pull.stdout or 'Pull complete' in jenkins_pull.stdout"

- name: Generate Jenkins service
  ansible.builtin.template:
    src: "docker_compose_service.j2"
    dest: "/etc/systemd/system/{{ jenkins_container_name }}.service"
    mode: "0644"
  notify: Restart container {{ jenkins_container_name }}

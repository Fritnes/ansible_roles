name: Ansible

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check and lint in Debian 13
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:trixie-slim \
            sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends python3 python3-venv
              python3 -m venv /tmp/ansible-venv
              /tmp/ansible-venv/bin/pip install ansible-core ansible-lint
              /tmp/ansible-venv/bin/ansible-galaxy collection install -r requirements.yml
              ANSIBLE_CONFIG=ansible.cfg /tmp/ansible-venv/bin/ansible-playbook -i localhost, tests/syntax.yml --syntax-check
              /tmp/ansible-venv/bin/ansible-lint --offline tests/syntax.yml
            '
name: Ansible

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Ansible tools
        run: python -m pip install ansible-core ansible-lint
      - name: Syntax-check all roles
        run: ansible-playbook -i localhost, tests/syntax.yml --syntax-check
      - name: Lint roles (advisory during migration)
        run: ansible-lint --offline tests/syntax.yml
        continue-on-error: true
---
# handlers file for AnsibleWIREGUARD
- name: Restart container {{ wggui_container_name }}
  ansible.builtin.systemd:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ wggui_container_name }}"

- name: Restart wireguard
  ansible.builtin.systemd:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ item }}"
  loop:
    - "wgui.path"
    - "wgui.service"

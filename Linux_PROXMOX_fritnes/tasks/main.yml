---
# tasks file for AnsiblePROXMOX

- name: Find legacy APT source lists
  ansible.builtin.find:
    paths: /etc/apt
    patterns: "*.list"
    recurse: true
  register: proxmox_legacy_source_lists

- name: Remove legacy Proxmox repository entries
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*deb\s+.*https?://[^ ]*proxmox\.com/debian/(ceph-quincy|pve)\s+bookworm\s+.*$'
    state: absent
  loop: "{{ proxmox_legacy_source_lists.files }}"

- name: Remove Proxmox enterprise DEB822 repositories
  ansible.builtin.deb822_repository:
    name: "{{ item }}"
    state: absent
    install_python_debian: true
  loop:
    - proxmox-ceph-enterprise
    - proxmox-pve-enterprise

- name: Add specified repository into sources list
  ansible.builtin.deb822_repository:
    name: proxmox-pve-no-subscription
    types: [deb]
    uris: http://download.proxmox.com/debian/pve
    suites: bookworm
    components: [pve-no-subscription]
    state: present
    install_python_debian: true

- name: Install useful packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - curl
      - smartmontools
      - iftop
      - traceroute
      - nmap
      - net-tools
      - zip
      - htop
      - lm-sensors
    state: present

- name: Dependonsi Debian
  ansible.builtin.include_tasks: "f2b.yml"

---
# handlers file for base
- name: Restart fail2ban
  ansible.builtin.systemd:
    state: restarted
    enabled: true
    daemon_reload: true
    name: fail2ban

- name: Restart nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted

- name: Disable and mask UFW
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
    masked: true

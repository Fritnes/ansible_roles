---
# Task for Debian-based hosts

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install useful packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - gnupg
      - git
      - iputils-ping
      - dnsutils
      - cron
      - curl
      - smartmontools
      - iftop
      - traceroute
      - nmap
      - net-tools
      - rsyslog
      - zip
      - htop
      - screen
    state: present

- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
    state: present
  when: vm | bool and hypervisor == "KVM"

- name: Install open-vm-tools
  ansible.builtin.apt:
    name:
      - open-vm-tools
    state: present
  when: vm | bool and hypervisor == "VMware"

- name: Change resolved.conf
  ansible.builtin.lineinfile:
    dest: /etc/systemd/resolved.conf
    state: present
    regexp: '^DNSStubListener='
    line: 'DNSStubListener=no'
  notify: Restart systemd-resolved
  when: no_ct | bool
  ignore_errors: true  # noqa: ignore-errors

- name: Link for resolv.conf
  ansible.builtin.file:
    src: "/run/systemd/resolve/resolv.conf"
    dest: "/etc/resolv.conf"
    state: link
  when: no_ct | bool
  ignore_errors: true  # noqa: ignore-errors

- name: Create /etc/apt/trusted.gpg
  ansible.builtin.copy:
    content: ""
    dest: /etc/apt/trusted.gpg
    force: false
    mode: "0644"

- name: Link for trusted.gpg
  ansible.builtin.file:
    src: "/etc/apt/trusted.gpg"
    dest: "/etc/apt/trusted.gpg.d/trusted.gpg"
    state: link

- name: Update timezone
  ansible.builtin.copy:
    content: "{{ set_timezone }}\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"
  notify: Reconfigure timezone data

- name: Disable UFW
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
    masked: true

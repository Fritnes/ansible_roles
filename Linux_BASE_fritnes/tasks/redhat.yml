- name: Install dependencies
  ansible.builtin.dnf:
    name:
      - epel-release
      - curl
      - smartmontools
      - traceroute
      - nmap
      - net-tools
      - qemu-guest-agent
      - rsyslog
    state: present

- name: Install qemu-guest-agent
  ansible.builtin.dnf:
    name:
      - qemu-guest-agent
    state: present
  when: vm | bool and hypervisor == "KVM"

- name: Install open-vm-tools
  ansible.builtin.dnf:
    name:
      - open-vm-tools
    state: present
  when: vm | bool and hypervisor == "VMware"

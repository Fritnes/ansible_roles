---
      - name: Install dependonsi
        yum:
          name:
          - epel-release
          - curl
          - smartmontools
          - traceroute
          - nmap
          - net-tools
          - qemu-guest-agent
          - net-tools
          - rsyslog
          state: present

      - name: Install qemu-guest-agent
        yum:
          name:
          - qemu-guest-agent
          state: present
        when: VM and HYPERVISOR == "KVM"

      - name: Install open-vm-tools
        yum:
          name:
          - open-vm-tools
          state: present
        when: VM and HYPERVISOR == "VMware"

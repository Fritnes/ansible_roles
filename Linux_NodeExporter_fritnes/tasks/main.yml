- name: Check Node Exporter version
  ansible.builtin.import_tasks: check.yml
  tags:
    - check_node_exporter

- name: Install or upgrade Node Exporter
  ansible.builtin.import_tasks: install.yml
  become: true
  when: >-
    (not __node_exporter_is_installed.stat.exists) or
    ((__node_exporter_current_releases.stdout_lines | length > 0) and
    (__node_exporter_current_releases.stdout_lines[0].split(" ")[2] != node_exporter_latest_releases)) or
    ((__node_exporter_current_releases.stderr_lines | length > 0) and
    (__node_exporter_current_releases.stderr_lines[0].split(" ")[2] != node_exporter_latest_releases))

- name: Install Node Exporter collection scripts
  ansible.builtin.import_tasks: scripts.yml
  tags:
    - install_collection

- name: Configure Node Exporter service
  ansible.builtin.import_tasks: config.yml

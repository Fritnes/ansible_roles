- name: Upgrade system
  ansible.builtin.apt:
    update_cache: true

- name: Install prerequisites
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - gnupg-agent
      - python3-pip

- name: Add Docker GPG apt key
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower | replace('\"', '') }}/gpg"
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb https://download.docker.com/linux/{{ ansible_distribution | lower | replace('"', '') }}
      {{ ansible_distribution_release | lower | replace('"', '') }} stable
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  notify: Restart docker


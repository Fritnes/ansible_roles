- name: Add students {{ item.username }}
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: "{{ item.group }}"
    append: true
    shell: "{{ item.shell }}"
    state: "present"
    createhome: true

- name: Set up authorized keys for {{ item.username }}
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    key: "{{ lookup('file', item.public_key) }}"
#    key: "{{ item.public_key }}"
    state: "present"

- name: Set up .bashrc for {{ item.username }}
  ansible.builtin.copy:
    src: "bash/bashrc"
    dest: "/home/{{ item.username }}/.bashrc"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0644"

- name: Set up .dircolors for {{ item.username }}
  ansible.builtin.copy:
    src: "bash/dircolors"
    dest: "/home/{{ item.username }}/.dircolors"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0644"

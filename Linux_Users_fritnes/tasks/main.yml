---
# tasks file for users
- name: Check 'wheel' group
  ansible.builtin.group:
    name: wheel
    state: present

- name: Remove legacy passwordless wheel rule
  ansible.builtin.lineinfile:
    dest: /etc/sudoers
    state: absent
    regexp: '^%wheel ALL=\(ALL\) NOPASSWD: ALL$'
    validate: 'visudo -cf %s'

- name: Configure passwordless sudo for wheel
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/ansible-wheel
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  when: passwordless_sudo_wheel | bool

- name: Remove passwordless sudo drop-in when disabled
  ansible.builtin.file:
    path: /etc/sudoers.d/ansible-wheel
    state: absent
  when: not (passwordless_sudo_wheel | bool)

- name: SSHD
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    state: present
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
    - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
  notify: Restart sshd

- name: Deny Password
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    state: present
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: Restart sshd
  when: allow_ssh_password != "true"

- name: ADD Users
  ansible.builtin.include_tasks: add_users.yml
  loop: "{{ users | default([], true) }}"

- name: ADD students
  ansible.builtin.include_tasks: student_users.yml
  loop: "{{ student_users | default([], true) }}"
  when: students_allow == "true"

- name: DEL Users
  ansible.builtin.include_tasks: del_users.yml
  loop: "{{ del_users | default([], true) }}"

- name: Set up .bashrc root
  ansible.builtin.copy:
    src: "bash/bashrc"
    dest: "/root/.bashrc"
    owner: "root"
    group: "root"
    mode: "0644"

- name: Set up .dircolors root
  ansible.builtin.copy:
    src: "bash/dircolors"
    dest: "/root/.dircolors"
    owner: "root"
    group: "root"
    mode: "0644"

---
# tasks file for WGClient
- name: Install useful packages
  ansible.builtin.apt:
    name:
      - wireguard
      - resolvconf
    state: present

- name: Generate conf
  ansible.builtin.copy:
    src: "{{ wireguard_config_path }}"
    dest: "/etc/wireguard/{{ wg_config_name }}.conf"
    mode: "0600"
  notify: Restart wg-quick
